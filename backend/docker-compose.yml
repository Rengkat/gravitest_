services:
  postgres:
    image: postgres:16-alpine
    container_name: gravitest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gravitest
      POSTGRES_PASSWORD: gravitest_dev_password
      POSTGRES_DB: gravitest_dev
    ports:
      - "5432:5432"
    volumes:
      - gravitest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gravitest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gravitest-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gravitest_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional — only needed for library search. Comment out if you don't
  # want to run it locally yet; Meilisearch calls will just fail loudly
  # instead of crashing the app (see search module error handling).
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: gravitest-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: gravitest_dev_meili_key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - gravitest_meili_data:/meili_data

  # Optional — only needed for AI semantic search / recommendations.
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: gravitest-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - gravitest_qdrant_data:/qdrant/storage

volumes:
  gravitest_postgres_data:
  gravitest_redis_data:
  gravitest_meili_data:
  gravitest_qdrant_data:
